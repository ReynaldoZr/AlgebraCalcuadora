name: Verificar calculadora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Python ${{ matrix.python }} en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Comprobar reglas de estructura
        run: python herramientas/comprobar_reglas.py
      - name: Ejecutar pruebas matemáticas y de consola
        run: python -m unittest discover -s tests -v

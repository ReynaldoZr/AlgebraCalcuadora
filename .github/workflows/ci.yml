name: Verificar calculadora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Python ${{ matrix.python }} en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      CALCULADORA_EXIGIR_GUI: '1'
      CALCULADORA_EXIGIR_NUMERICOS: '1'
      CALCULADORA_EXIGIR_QT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Comprobar reglas de estructura
        run: python herramientas/comprobar_reglas.py
      - name: Instalar dependencias de semana 12
        run: python -m pip install -r requirements-numericos.txt
      - name: Instalar bibliotecas gráficas de Qt en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0
      - name: Instalar interfaz Qt Quick
        run: python -m pip install -r requirements-interfaz.txt
      - name: Ejecutar pruebas matemáticas y de consola
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Ejecutar pruebas con pantalla virtual en Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
